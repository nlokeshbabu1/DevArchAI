apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend-devarchai.fullname" . }}
  labels:
    {{- include "frontend-devarchai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "frontend-devarchai.selectorLabels" . | nindent 4 }}
