name: Ci of the frontend application

on:
    push:
        branches: ["main", "best-feature"]
    pull_request:
        branches: ["main", "best-feature"]
        paths:
            - 'frontend/**'
            - '.github/workflows/CI-Frontend.yml'


#we are using the default directory for the frontend application, so we don't need to specify a working-directory in the steps.
defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

###############################################
##  Keeps each PR and branch workflow in a separate concurrency group.
# example PR #11 → frontend-CI-11 2. Push to dev → frontend-CI-refs/heads/dev
## Cancels outdated PR workflows but allows branch push workflows to finish.
#################################################

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}

jobs:

  # ==========================================
  # Unit and Integration TEST
  # ==========================================
  
  test:
    name: unit and integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 1
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint - Code Quality
        run: npm run lint

      - name: Unit and Component Tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Test Coverage
        run: npm run test:coverage

  # ==========================================
  # SCA - NPM SECURITY AUDIT
  # ==========================================

  npm-security:
    name: NPM Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
            fetch-depth: 1
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high


  # ==========================================
  # 2C. SCA - DEPENDENCY REVIEW (PRs Only)
  # ==========================================
  dependency-review:
    name: SCA - Dependency Review
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 1
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

    ##########################################################
    ### Build the frontend application and create a production build artifact
    ##########################################################
  build-artifact:
    name: Build Frontend Artifact
    needs: [test, npm-security, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 1
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend artifact
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: frontend/dist
          retention-days: 5

  #########################
  ##docker build and push to dockerhub
  #########################
  docker-build-push:
    name: Docker Build and Push
    needs: build-artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 1
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup docker
        uses: docker/setup-buildx-action@v3

      - name: Extract docker image tag
        id: meta
        uses: actions/github-script@v6
        with:
          script: |
            const shortSha = context.sha.substring(0, 7);
            const tag = `${process.env.GITHUB_REF_NAME}-${shortSha}`;
            core.setOutput('version', tag);

      - name: Build docker image locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true # Loads image into local Docker daemon so Trivy can scan it BEFORE pushing
          tags: frontend:${{ steps.meta.outputs.version }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-report.sarif
          exit-code: '1' # Fails the pipeline and blocks Docker push if HIGH/CRITICAL CVEs exist
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF report
        if: always() && hashFiles('trivy-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3.28.13
        with:
          sarif_file: trivy-report.sarif

      - name: Generate SBOM
        if: success()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx
          output: frontend-sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        if: always() && hashFiles('frontend-sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.cdx.json
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}

      - name: Get published image digest
        id: digest
        run: |
          DIGEST=$(docker image inspect \
            --format='{{index .RepoDigests 0}}' \
            "${IMAGE_NAME}:${IMAGE_TAG}")

          echo "image-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}