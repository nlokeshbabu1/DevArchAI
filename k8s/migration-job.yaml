apiVersion: batch/v1
kind: Job
metadata:
  name: devarchai-migrate
  namespace: devarchai
  labels:
    app.kubernetes.io/name: devarchai-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devarchai-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: devarchai-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              from app.db.migrate import run_migrations, current_revision, pending_migrations
              print("Starting migrations...")
              run_migrations()
              rev = current_revision()
              pending = pending_migrations()
              print(f"Current revision: {rev}")
              if pending:
                  print(f"ERROR: {len(pending)} pending migration(s) remaining")
                  exit(1)
              print("All migrations applied successfully")
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devarchai-secrets
                  key: database-url
            - name: ENVIRONMENT
              value: production
            - name: LLM_PROVIDER
              value: mock
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
