# Pytest Configuration for DevArchAI Backend

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    --maxfail=5
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (API + DB)
    contract: Contract tests (API schema validation)
    security: Security tests (input validation, injection)
    performance: Performance tests (load, stress)
    ai: AI-specific tests (LLM, fallback)
    devops: DevOps-specific tests (file detection, rules)
    e2e: End-to-end tests
    slow: Slow running tests (>5s)
    requires_db: Tests requiring database
    requires_api: Tests requiring API server
    requires_ai: Tests requiring AI API access

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SAWarning

# Timeout (per test)
timeout = 300

# Database test settings — isolated Postgres from docker-compose.test.yml (port 5433).
# Override TEST_DATABASE_URL locally if your test container uses different host/port.
env =
    TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/devarchai_test
    TESTING=true
    DEBUG=false
    LLM_PROVIDER=mock

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML for CI
junit_family = xunit2
junit_logging = all
