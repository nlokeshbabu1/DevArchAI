# ============================================================================
# DevArchAI Technology Inventory
# ----------------------------------------------------------------------------
# Seed knowledge artifact for the RAG knowledge layer. This index maps every
# technology DevArchAI can analyze to its canonical rule IDs (extracted from
# the backend source of truth), applicable file types, external scanners, and
# ownership precedence used by technology detection.
#
# DO NOT hand-edit rule_id lists as free text — regenerate from source:
#   python scripts/generate_technology_inventory.py
# Rule IDs below are copied from the actual code at generation time.
# ============================================================================

inventory_version: "1.0.0"
generated_at: "2026-08-10"
generated_from:
  - app/rules/kubernetes.py
  - app/rules/terraform.py
  - app/rules/dockerfile.py
