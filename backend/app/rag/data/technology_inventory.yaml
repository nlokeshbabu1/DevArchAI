# Cross-cutting rule categories (apply across file types).
cross_cutting:
  - id: security
    rule_ids: [SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006, SEC-007, SEC-008]
    rule_modules: [app.rules.security]
  - id: reliability
    rule_ids: [REL-001, REL-002, REL-003, REL-004, REL-006]
    rule_modules: [app.rules.reliability]
  - id: scalability
    rule_ids: [SCALE-001, SCALE-002, SCALE-003, SCALE-004, SCALE-005, SCALE-006]
    rule_modules: [app.rules.scalability]
  - id: cost
    rule_ids: [COST-001, COST-002, COST-003, COST-004, COST-005]
    rule_modules: [app.rules.cost]
  - id: observability
    rule_ids: [OBS-001, OBS-002, OBS-003, OBS-004, OBS-005, OBS-006, OBS-007, OBS-0BS-008, OBS-009, OBS-010]
    rule_modules: [app.rules.observability, app.rules.devsecops.observability]
    notes:
      - "OBS-0BS-008 is the literal id attribute used by rule OBS-008 (typo preserved from source)."

# External scanner names registered in app/scanners/registry.py, and the rule
# ID families their findings carry. These enrich knowledge context but are NOT
# DevArchAI-owned rules.
external_scanners:
  - name: trivy_filesystem
    rule_id_families: [TRV, AVD]
    description: Trivy filesystem scan (vulnerabilities, misconfigurations, secrets)
  - name: trivy_config
    rule_id_families: [AVD, TRV]
    description: Trivy config scan (IaC misconfigurations)
  - name: checkov
    rule_id_families: [CKV]
    description: Checkov IaC security scanning
  - name: tfsec
    rule_id_families: [AWS, GCP, AZURE, K8S, GEN]
    description: Terraform security scanner
  - name: kube_score
    rule_id_families: [KS]
    description: Kubernetes object security scoring
  - name: hadolint
    rule_id_families: [DL, HL]
    description: Dockerfile linter
  - name: gitleaks
    rule_id_families: [GL, GITLEAKS]
    description: Secret scanning across git history
  - name: npm_audit
    rule_id_families: [npm]
    description: npm dependency vulnerabilities
  - name: pip_audit
    rule_id_families: [pip]
    description: Python dependency vulnerabilities
  - name: govulncheck
    rule_id_families: [go]
    description: Go vulnerability scanner
  - name: dependency_check
    rule_id_families: [CVE, NVD]
    description: OWASP dependency-check across ecosystems
