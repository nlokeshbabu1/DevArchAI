[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsec"
version = "0.1.0"
description = "Command-line interface for the DevArchAI DevSecOps platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "DevArchAI" }]
keywords = ["devsecops", "security", "scanning", "cli", "ci-cd", "terraform", "kubernetes", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "keyring>=24.3.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
devsec = "devsec.main:entrypoint"

[project.urls]
Homepage = "https://github.com/nlokeshbabu1/DevArchAI"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devsec*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = [".git", ".venv", "venv", "__pycache__", "node_modules", "dist", "build"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit (security)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (Typer pattern)
    "B904",  # raise without from inside except
    "S101",  # allow assert in tests only (overridden per-file below)
    "S603",  # subprocess calls reviewed manually in utils/git.py
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S105", "S106", "S108", "S607"]
"src/devsec/api/progress.py" = ["S110"]

[tool.ruff.lint.isort]
known-first-party = ["devsec"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "websockets", "websockets.*"]
ignore_missing_imports = true
